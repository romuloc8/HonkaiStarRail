<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>星穹铁道 · 台词语言学实验室</title>
<style>
:root{--bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--gold:#e3b341;--green:#3fb950;--red:#f85149;--purple:#c07de0;font-family:'Segoe UI',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);min-height:100vh}
nav{position:sticky;top:0;z-index:10;background:rgba(13,17,23,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:.2rem;padding:0 1.2rem;overflow-x:auto}
.brand{font-weight:800;color:var(--gold);padding:.9rem 1rem .9rem 0;white-space:nowrap}
.tab{padding:.9rem 1rem;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;font-size:.9rem}
.tab.active{color:var(--accent);border-color:var(--accent)}
.page{display:none;max-width:1200px;margin:0 auto;padding:1.5rem}
.page.active{display:block}
h2{font-size:1.1rem;margin-bottom:.4rem}
.sub{color:var(--muted);font-size:.85rem;margin-bottom:1.2rem;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:.8rem}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:1rem}
.card h3{font-size:1rem;display:flex;justify-content:space-between;align-items:baseline}
.card h3 small{color:var(--muted);font-weight:400;font-size:.75rem}
.bar{display:flex;align-items:center;gap:.5rem;font-size:.75rem;margin:.25rem 0}
.bar span:first-child{width:48px;color:var(--muted);text-align:right}
.bar .o{flex:1;height:8px;background:var(--bg3);border-radius:4px;overflow:hidden}
.bar .i{height:100%;border-radius:4px}
.bar span:last-child{width:44px}
.chips{display:flex;flex-wrap:wrap;gap:.25rem;margin-top:.5rem}
.chip{font-size:.72rem;padding:.12rem .45rem;border-radius:10px;background:rgba(88,166,255,.12);color:var(--accent);border:1px solid rgba(88,166,255,.25)}
.chip.gold{background:rgba(227,179,65,.12);color:var(--gold);border-color:rgba(227,179,65,.3)}
.quote{font-size:.78rem;color:var(--muted);margin-top:.5rem;line-height:1.5;border-left:2px solid var(--border);padding-left:.5rem}
input[type=search]{background:var(--bg2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:.45rem .9rem;font-size:.9rem;outline:none;width:260px;margin-bottom:1rem}
select{background:var(--bg2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:.45rem .6rem;font-size:.85rem;margin-left:.5rem}
/* heatmap */
.heat{overflow:auto;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:1rem}
.heat table{border-collapse:collapse;font-size:.68rem}
.heat th{color:var(--muted);font-weight:500;padding:2px;white-space:nowrap}
.heat th.v{writing-mode:vertical-rl;transform:rotate(180deg);height:64px}
.heat td{width:22px;height:22px;text-align:center;cursor:default}
.pairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:.6rem;margin-top:1rem}
.pair{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:.7rem .9rem;font-size:.85rem;display:flex;justify-content:space-between}
/* quiz */
.qbox{max-width:640px;margin:0 auto}
.qtext{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:1.4rem;font-size:1.05rem;line-height:1.7;margin-bottom:1rem;min-height:110px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.opt{padding:.75rem;border-radius:10px;border:1px solid var(--border);background:var(--bg3);color:var(--text);cursor:pointer;font-size:.95rem}
.opt:hover{border-color:var(--accent)}
.opt.ok{border-color:var(--green);background:rgba(63,185,80,.15)}
.opt.bad{border-color:var(--red);background:rgba(248,81,73,.12)}
.score{text-align:center;color:var(--muted);font-size:.85rem;margin:.8rem 0}
.btn{padding:.55rem 1.2rem;border:none;border-radius:8px;background:var(--accent);color:#0d1117;font-weight:700;cursor:pointer}
/* tb */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.7rem;margin-bottom:1.2rem}
.stat{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:.9rem;text-align:center}
.stat b{display:block;font-size:1.5rem;color:var(--accent)}
.stat span{font-size:.75rem;color:var(--muted)}
.tbline{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:1.2rem;font-size:1.05rem;line-height:1.7;min-height:80px;margin-bottom:.8rem}
.list{columns:2;column-gap:1.5rem;font-size:.82rem;color:var(--muted);line-height:1.7}
@media(max-width:640px){.opts{grid-template-columns:1fr}.list{columns:1}}
</style>
</head>
<body>
<nav>
  <div class="brand">✦ 台词语言学实验室</div>
  <div class="tab active" onclick="go('fp',this)">语言指纹</div>

  <div class="tab" onclick="go('quiz',this)">谁说的？</div>

<div class="page active" id="p-fp">

    <option value="question">按疑问句率</option><option value="laugh">按笑声率</option>
  </select>
  <label style="font-size:.82rem;color:var(--muted);margin-left:.6rem"><input type="checkbox" id="fpAvatarOnly" checked onchange="renderFP()"> 仅可玩角色</label>
  <div class="grid" id="fpGrid"></div>
</div>

<div class="page" id="p-sim">
  <h2>说话风格相似度</h2>
  <div class="sub">对每位角色的全部台词做字符二元组频率向量，计算余弦相似度。颜色越亮越相似。下方列出最像与最不像的组合。</div>
  <div class="heat" id="heat"></div>
  <h2 style="margin-top:1.4rem">风格最接近的搭档</h2>
  <div class="pairs" id="pairsHi"></div>
  <h2 style="margin-top:1.4rem">风格差异最大的组合</h2>
  <div class="pairs" id="pairsLo"></div>
</div>

<div class="page" id="p-quiz">
  <div class="qbox">
    <h2>这句话是谁说的？</h2>
    <div class="sub">题库来自游戏内真实台词（已去除含角色名的句子）。</div>
    <div class="qtext" id="qText"></div>
    <div class="opts" id="qOpts"></div>
    <div class="score" id="qScore"></div>
    <div style="text-align:center"><button class="btn" onclick="nextQ()">下一题 →</button></div>
  </div>
</div>

<div class="page" id="p-tb">
  <h2>开拓者到底能说什么？</h2>
  <div class="sub">遍历全部剧情脚本，收集所有玩家可选择的对话选项。这是「你」在整个游戏里能说出的所有话。</div>
  <div class="stats" id="tbStats"></div>
  <h2>随机一句开拓者语录</h2>
  <div class="tbline" id="tbLine"></div>
  <button class="btn" onclick="tbRandom()">再来一句</button>
  <h2 style="margin-top:1.6rem">开拓者与垃圾桶</h2>
  <div class="list" id="tbTrash"></div>
</div>

道了么？"}, {"s": "波提欧", "t": "你要是有我这口钢牙，随便嚼！"}, {"s": "砂金", "t": "我们不必遮遮掩掩，来谈谈您的妹妹吧。令妹的才能在演艺界无出其右，可您也知道，回到匹诺康尼后，她的声音就一直不太*谐调*。"}, {"s": "黄泉", "t": "这些声音…只是梦境的影子。无需在意。"}, {"s": "希儿", "t": "而且大家也都表现出了支持。看来布洛妮娅给他们留下的印象还不错。"}, {"s": "三月七", "t": "唉，在这个地方等你真是太无聊了！没人陪我聊天，没有网，连吃的喝的都没有——简直跟坐牢一样！"}, {"s": "三月七", "t": "哎呀，反正用的不是你的资金，当是份礼物收下就好啦。"}, {"s": "波提欧", "t": "对。它的主人一定告诉过你，这东西对巡海游侠以外的人一文不值，只有物归原主才能发挥作用。"}, {"s": "彦卿", "t": "姐姐既是赏剑之人，我就不卖关子了。正是罗浮的景元将军。"}, {"s": "藿藿", "t": "你在竭尽全力蛊惑我，看来你对胜负根本也没什么把握。"}, {"s": "丹恒", "t": "放心吧，通常都能在当地找到值得信赖的伙伴。"}, {"s": "三月七", "t": "小宝烛，还记得你说过的「朋友」吗？"}, {"s": "桂乃芬", "t": "抓捕岁阳的行动被咱们渲染成一个个抓人眼球的娱乐视频。人们也会对类似的事件半信半疑，恐慌情绪一下子就消失了！"}, {"s": "青雀", "t": "哪里可疑了？放心吧，我又不傻！一般的诈骗消息忽悠不了我的。"}, {"s": "素裳", "t": "还是让小秘书再想想口号吧！现在我们回去找燕翠师傅。"}, {"s": "希儿", "t": "…这叫哪门子「疏散」？明明就是你们强行霸占了矿区，还把矿民赶出了自家家门！"}, {"s": "藿藿", "t": "呃，没事，就当我什么也没问。"}, {"s": "星期日", "t": "「抱歉，让你久等了，三月七小姐。」"}, {"s": "银狼", "t": "唔…倒是比我想象中要好些，权当消遣放松一下也不错…嗯，你怎么了？"}, {"s": "符玄", "t": "看不完的参考情报，批不完的军务报告，还要同天舶司处理外事，同工造司讨论修缮…如此一看，出征巡猎反而更像是休假。"}, {"s": "希露瓦", "t": "啊…收拾累了，今天就到这里吧。辛苦你们俩陪我忙前忙后啦。"}, {"s": "黄泉", "t": "就算结局早已注定，那也无妨，人改变不了的事太多。"}, {"s": "黑天鹅", "t": "请问一栋建筑在什么情况下才需要修缮？结合下{M#他}{F#她}方才的经历，答案很明了了。"}, {"s": "藿藿", "t": "有人一起走就放心多了…不瞒你说，我已经快要站不稳了……"}, {"s": "缇宝", "t": "难道…这是*我们*丢失的记忆？"}, {"s": "黑天鹅", "t": "看来有人恭候多时了啊。终于打算走上台前了么……"}, {"s": "卢卡", "t": "所以您的意思是，好好打这场「邀请赛」，用实力证明自己？"}, {"s": "黄泉", "t": "…很久以前，我也和你一样，拥有无可替代的同伴。我们也曾踏上旅途，在每一个正确的时候，尽己所能，做出最正确的选择。"}, {"s": "符玄", "t": "我已指派了一位门人在「长乐天」广场前等候，一旦内务整顿完成，便传令让接引人带各位进入太卜司，还请各位耐心逗留。"}, {"s": "波提欧", "t": "以防万一，如果那忆者始终不出现，我还有个备用计划…这是最后一个了。"}, {"s": "青雀", "t": "对呀，我见你第一面的时候，就觉得你这个人责任感也太重了，放轻松吧。"}, {"s": "艾丝妲", "t": "处理完之前的事情，这几天甚至都有空闲来车上转转了。"}, {"s": "丹恒", "t": "作为无名客，列车还在等着我。"}, {"s": "万敌", "t": "「救世的信念，远比世界更为沉重。」"}, {"s": "虎克", "t": "「真诚的爱」原来是这么好用的东西吗？好耶！"}, {"s": "阿格莱雅", "t": "明日同一时分，黄金裔将在创世涡心集合，归还天谴之矛，{RUBY_B#纷争之泰坦}尼卡多利{RUBY_E#}的火种。"}, {"s": "布洛妮娅", "t": "别忘了，你现在的职责之一是「守护」我这个大守护者——你可不能因为这种事情受伤。"}, {"s": "万敌", "t": "反对。形式大于内容，怎么推得出让顾客满意的菜单？"}, {"s": "波提欧", 慈悲放你们一条生路，你们倒是一点都不领情啊。"}, {"s": "桑博", "t": "我的个乖乖，这锤子分量可不轻啊…应该就是「花火大人遇害案」的凶器了。"}, {"s": "青雀", "t": "啊，你果然也在这里，你也是来找经纪人讨说法的吗？"}, {"s": "素裳", "t": "说实话，我是第一次见到十王司的判官…你们都负责什么呀？"}, {"s": "佩拉", "t": "这样一来，综合馆就应该准备好对公众开放了。"}, {"s": "缇宝", "t": "「但是，*我们*有种很不妙的预感！」"}, {"s": "星期日", "t": "家族依旧承诺会保护来宾周全，但各位也不妨留个心眼。"}, {"s": "白厄", "t": "毕竟，诸神的火种如今皆已收殓于此……"}, {"s": "布洛妮娅", "t": "我们从「星核」手中夺回了原生的天空…就算这片土地仍然在走向衰亡，至少我们也争取到了一些时间。这个结果已经足够好了，希儿。"}, {"s": "藿藿", "t": "我问过尾巴，岁阳这样的生物即便被关在「方寸天地」之间也不会觉得束手束脚，它们和我们这样的有形之物不同。"}, {"s": "波提欧", "t": "…不对劲，难道说有人捷足先登，趁我们来之前把{F#她}{M#他}和从者都干掉了？"}, {"s": "克拉拉", "t": "帕斯卡，到底为什么你会被同伴嫌弃……"}, {"s": "佩拉", "t": "后来，随着时间的推移，纪念馆的展出范畴也逐渐拓宽，直到变成了今天的模样。"}, {"s": "彦卿", "t": "比如列车的构造之类的，但他都回答得好简洁……"}, {"s": "砂金", "t": "老实说，他们没作出一点贡献，但却为我发现了一件「遗产」——"}, {"s": "桂乃芬", "t": "…虽然凶宅是假的，这不妨碍我们更新一下「罗浮杂俎」。"}, {"s": "希儿", "t": "同意还是拒绝，不管她现在偏向于选哪个…她肯定比我看得更远，考虑到的东西绝对比我更多，更完整。"}, {"s": "希儿", "t": "普通机器人是没有自主意志的，它们的目的，其实就是史瓦罗的目的。"}, {"s": "艾丝妲", "t": "他一个搞物理研究的，搞什么文化调查啊？这跨度未免也太大了吧！"}, {"s": "藿藿", "t": "…它就是打来恐怖电话的那位，玉兆的追踪源头显示就在它身上。"}, {"s": "娜塔莎", "t": "关于上次回收处理「特效药」的事，我想再郑重地和你道一次谢。"}, {"s": "希儿", "t": "哈，运气不赖，居然真让咱们找到了。"}, {"s": "虎克", "t": "怎、怎么是你们！可恶——尤利安这家伙，居然还请外援？真是不讲武德！"}, {"s": "娜塔莎", "t": "…作为对他们的生命负责的医生，我不能接受这种说辞。我对所谓「特效药」的态度不会改变。"}, {"s": "克拉拉", "t": "为了让列车重新动起来，花了不少功夫，很辛苦。"}, {"s": "昔涟", "t": "让人忍不住想哼起儿时的歌谣呢……"}, {"s": "希儿", "t": "哈哈哈，就这？这跟隔着靴子搔痒似的，不带劲。看来在你回去之前，我得好好教你几句黑话。"}, {"s": "瓦尔特", "t": "这也不行。先不谈知更鸟小姐，我总觉得方才星期日先生的态度有些不对劲，但说不上来是为什么…至少得确保他不会临阵倒戈。"}, {"s": "那刻夏", "t": "第一，叫我阿那克萨戈拉斯。第二，什么叫「也」？你的意思…你想死在树庭？当真老糊涂了？"}, {"s": "艾丝妲", "t": "至于你带回来的这台「查宝」，就留给我作纪念吧～我可以把这个具有传奇经历的小家伙加入我的古董收藏。"}, {"s": "克拉拉", "t": "那个小偷…怎么又来偷零件了呀？不知道这次有没有留下什么线索……"}, {"s": "娜塔莎", "t": "这次你真得感谢桑博了，多亏了他的情报，我们才能在关键时刻赶到。"}, {"s": "彦卿", "t": "再见，丹恒先生。希望下一次，咱们见面的时候不用这么紧张了。"}, {"s": "昔涟", "t": "这片麦田可是我们的宝贝，不能随便踩进去哦。会把希望踩坏的。"}, {"s": "希露瓦", "t": "…想说动你可真是太难了。就听你的吧，老弟。"}, {"s": "瓦尔特", "t": "不，晴霓小姐不必多礼，只是举手之劳罢了。"}, {"s": "流萤", "t": "嗯，我找到了您说的那几个人。光顾了「慈玉典押」后，他们各自的愿望确实都成真了。"}, {"s": "黄泉", "t": "调侃一下，别在意，这的确是你的房间。此前在走廊上，我见那位先生轻手轻脚，不像是回自己房间，就有所提防……"}, {"s": "银狼", "t": "刃被那个仙舟女人带走了。危。"}, {"s": "希儿", "t": "连你也这样啊。嗐，这事办得可真是……"}, {"s": "黑天鹅", "t": "你好。我有希望忏悔的事。我曾出于私心，修改了他人的记忆。"}, {"s": "虎克", "t": "呣呣呣～就是…大人的鼹鼠党吧？"}, {"s": "克拉拉", "t": "唔…不知道这里会不会有线索呢？"}, {"s": "景元", "t": "我已嘱托符玄，她会打开太卜司的捷径，为各位行个方便。"}, {"s": "星期日", "t": "很高兴能以这种形式重温过去。走吧，这场告别还很漫长。"}, {"s": "阿格莱雅", "t": "放心，即便没有他们的情报，我也已探查到城底的暗流。不过是些小小的麻烦，我能亲自解决。"}, {"s": "桂乃芬", "t": "当然啦，我知道大家对这个新型捉鬼方式不是很信任…那你们稍等一下啊，我来翻翻情报，咱们几人挑一个试试。"}, {"s": "波提欧", "t": "也不一定就是祂，但肯定有个形而上的意识在作祟。别说哥们悲观，如果人类的自由意志可信，那还要巡海游侠做什么？"}, {"s": "砂金", "t": "…你将在这里亲自化身「死亡」。"}, {"s": "素裳", "t": "所以还是得亲自上前线确认咯？"}, {"s": "白厄", "t": "你做的烤饼确实不错，但这次，我会研制出胜过你的菜品。"}, {"s": "娜塔莎", "t": "虎克，怎么哭鼻子了？是被坏人欺负了吗？"}, {"s": "景元", "t": "几位不妨先行一步，待批阅完手头的公文，我会立刻前往绥园。"}, {"s": "希露瓦", "t": "…我还是筑城者的一员、在科研部工作的时候，研究的就是「星核」。"}, {"s": "不死途", "t": "…话说回来，你知道吗？名侦探麦卡托最厉害的特技，就是将一切细节藏于脑内，并通过「思维回廊」进行分析。"}, {"s": "布洛妮娅", "t": "但也正因如此，我们才有不输给任何人的决心。"}, {"s": "波提欧", "t": "你信这鼻行兽养的玩意儿，不如信我是仙舟的将军。别怪我说话难听，让他这样的人悔改，不如叫反物质军团去盗贼公国植树造林。"}, {"s": "姬子", "t": "人生有许多发展本就是出乎意料，不受控制的。就像你来到列车的经历一样。"}, {"s": "砂金", "t": "拒绝么…我本该用令咒让你屈服，但我实在讨厌这种烙在身上，能使唤别人的东西。"}, {"s": "符玄", "t": "…可是，「穷观阵」是不会错的。"}, {"s": "藿藿", "t": "岁阳没有善恶之分，他们只是依照自己的欲望和情绪来行动。希望收服其他的岁阳时，也能这么轻松。"}, {"s": "波提欧", "t": "宝了个贝的，那就赶紧开始吧，还废话什么呢？"}, {"s": "黑天鹅", "t": "我还在猜你什么时候会想起我呢…谢谢你，亲爱的。"}, {"s": "青雀", "t": "…你这「师傅的梦想」可真是块膏药，哪里需要往哪里贴。"}, {"s": "流萤", "t": "还记得邀请函上的问题吗——生命因何而沉睡？"}, {"s": "流萤", "t": "毕竟，我们永远不会知道，从哪一瞬间起，我们就用完了…与某个人在这片银河间所有地方共有的…所有时间。"}, {"s": "克拉拉", "t": "工坊？是指铆钉镇上那座「淬火工坊」吗？"}, {"s": "万敌", "t": "让你失望了，外城是由罪犯建造的。"}, {"s": "桑博", "t": "说来话长咯。反正，现在上下层之间的联系几乎断绝了。"}, {"s": "虎克", "t": "…我还没说要干什么呢！不过，精神头很足，不愧是鼹鼠党的荣誉队员！"}, {"s": "娜塔莎", "t": "「炉心」…通往地上的道路，现在近在咫尺。"}, {"s": "昔涟", "t": "也许在旅行途中，你可以把那些故事都讲给我听。这样一来，它们也能成为我们共同的回忆。"}, {"s": "那刻夏", "t": "我自有把握。不妨就请眼前这位至高之神，为我们一一道来吧。"}, {"s": "布洛妮娅", "t": "银鬃铁卫已经奉命全部撤回地上了，在这里，我不能以铁卫的身份行动。"}, {"s": "虎克", "t": "哼，别装啦！你的表情已经把你出卖啦！"}, {"s": "星期日", "t": "「和平从未真正降临在流放之地。这段历史千头万绪，太过复杂，请允许我用寓言的方式向诸位呈现。」"}, {"s": "桂乃芬", "t": "真是个难忘的夜晚，不是吗？我还打算再待一会。就让我再说最后一句吧——"}, {"s": "黑塔", "t": "不过，你这个太干净了，一点烟火气都没有。"}, {"s": "丹恒", "t": "总之，事情复杂，等我们正面对上时，我再向你解释。"}, {"s": "符玄", "t": "但我身处其中，或多或少受到外力牵引，所知偏颇。故而请各位与我一同梳理脉络，分晓其中的诸多细节。"}, {"s": "不死途", "t": "敲一下就会印上「你很行」字样的审判锤，也只卖出去两把。"}, {"s": "黄泉", "t": "我很喜欢你的比喻。诚然，鸟儿生来就会飞翔，但在遥远的曾经，它们的祖先也只得从地面仰望高天。"}, {"s": "波提欧", "t": "大导演，我现在就是你的影迷了，以后多整点爱你片子吧！"}, {"s": "卢卡", "t": "我转身离去？我认输？这与我冲上去拼一把有什么本质区别吗？因为无论怎么选，当时我的命都不在我自己手里。"}, {"s": "希儿", "t": "…我知道了，那我就去一趟铆钉镇，帮你把东西拿回来。"}, {"s": "卢卡", "t": "伊戈尔•哈夫特是雅利洛-Ⅵ的英雄，但我们都对他的生平经历知之甚少。找到这些资料，也算是进一步认识他了……"}, {"s": "万敌", "t": "他死后，我本想过带领族人回归故乡。但彼时的悬锋已是一片荒芜，能在其中生长的只有黑暗与疯狂。"}, {"s": "银狼", "t": "啊？写信报平安？你没有手机的吗？"}, {"s": "桑博", "t": "你想想，这矿具三件套，对矿工来说可不就是宝藏吗？这几件装备结合起来能产出的价值，比任何宝箱战利品都——"}, {"s": "佩拉", "t": "您说的这件事…和博物馆的展品失窃案有关系吗？"}, {"s": "素裳", "t": "哈哈哈哈，对哦！好像确实没人问过你肯不肯加入这个捉鬼小队，就默认你是小队的一员了。"}, {"s": "昔涟", "t": "嗯。第一次逐火以「律法」的试炼作结，我们要在火种被归还前找到半神，取得对方的信任。"}, {"s": "希露瓦", "t": "这是敌袭警报…整个后备区的铁卫都要和我们为敌了。"}, {"s": "景元", "t": "丹恒，我的后背，就拜托你了。"}, {"s": "砂金", "t": "去你该去的地方吧，我迫不及待想看到公司舰队包围匹诺康尼的样子了。你也拿到你想要的东西了，不是么？"}, {"s": "阿格莱雅", "t": "这很鲁莽，他身上毕竟还携带着一颗火种。"}, {"s": "砂金", "t": "来吧，看看谁能笑到最后——游戏开始！"}, {"s": "赛飞儿", "t": "想起来了？看来用不着我来帮你回忆了哪。她肯定是趁你大意，偷偷把若虫塞进了你的「口袋」里。"}, {"s": "藿藿", "t": "…你注意到了吗？这位文远先生，好像他没有被附身。而这岁阳也不太寻常…事情比想象中要复杂一些……"}, {"s": "姬子", "t": "知更鸟小姐舍生取义的精神实在令人动容。星穹列车也郑重承诺，不会抛下每一位同伴。"}, {"s": "那刻夏", "t": "作为你的老师，我当然希望你能在充分学习之后赞同我的观点。但是你如果不同意我的观点，你最好有足以反驳我的学识与思考……"}, {"s": "瓦尔特", "t": "怪不得仙舟人随星舰流浪宇宙，从不在某个星球定居……"}, {"s": "艾丝妲", "t": "想必是我这代理站长身份让他有一些戒心。据说这「聊天服务」是会员邀请制的，你去找他聊聊，要是也能得到邀请那就更好了。"}, {"s": "符玄", "t": "与那时一样，本座会在这「穷观阵」的中心引导阵法。你们要做的，是将那座三座阵基重启。去吧，可别让判官久等了。"}, {"s": "素裳", "t": "我也觉得，毕竟被绑在一起这么多年，多多少少得念个旧。就算离开也要回来告别一下嘛。"}, {"s": "波提欧", "t": "因为咱俩他呜呜伯的不是一路人啊！你为胜利而来，我为仇恨而来。你为荣誉而来，但荣誉对我一文不值。"}, {"s": "希儿", "t": "…咳，这都是他自己一拍脑门想出的主意。同不同意都看你，史瓦罗。"}, {"s": "景元", "t": "若你赢了，我便重续当年的对决。若是输了，你要回答他们一个问题——不可说谎，不可狡辩。成交？"}, {"s": "桂乃芬", "t": "裳裳，你就放一百个心吧。现在的我，冷静地就像一台无情的冰箱！"}, {"s": "星期日", "t": "满愿果然有能力操纵它们，可在公开镜头下，她理应避嫌才对。"}, {"s": "卢卡", "t": "好啦！我要准备上场了！我们得好好教教他们——冒充别人是不对的！"}, {"s": "希儿", "t": "你们的列车长，帕姆，它喜欢什么样的食物？雪萝卜？野菜？还是说……"}, {"s": "赛飞儿", "t": "欸，先别急嘛。刚才你问我的那个问题，我好像突然想起来了——"}, {"s": "黑塔", "t": "好。没什么事，我就先挂了。下线。"}, {"s": "彦卿", "t": "呼雷！看仔细了，云骑天威，尽在此剑！"}, {"s": "风堇", "t": "最后一站的目的地，是万敌阁下的故乡——悬锋城。"}, {"s": "黑塔", "t": "好处是，模拟宇宙里不仅有你熟悉的场景，也有你熟悉的人物，所以不会觉得孤独。"}, {"s": "白厄", "t": "哈、哈哈，当然不会，我已经是个成熟的厨师了，这种评审当然不在话下。没问题的！"}, {"s": "布洛妮娅", "t": "下层区也是贝洛伯格的一部分，如果史瓦罗的存在威胁到了这里的居民，我当然站在你们这一边。"}, {"s": "桂乃芬", "t": "粉丝数多起来，果然就能收到一些新线索…你们看，我的战略没有错！"}, {"s": "遐蝶", "t": "也许我的回答有些空泛，没有意义，阿那克萨戈拉斯教授……"}, {"s": "瓦尔特", "t": "后来，列车受她委托，护送停云小姐回乡。途中在匹诺康尼停泊，也有部分静养的意图。"}, {"s": "黑塔", "t": "区区绝灭大君，还不至于让我「消耗过度」。我只是没上线而已。"}, {"s": "克拉拉", "t": "欸？！声音太大啦…如果犯人就在这里的话，肯定会被吓跑的！"}, {"s": "白厄", "t": "真没想到将来会遇到这么多人，还有他们的心愿……"}, {"s": "黑塔", "t": "「我确实做过不少和你相关的研究，但，让我们暂时先放下学术成就的攀比心吧…你可以是比较重要的成就，之一。」"}, {"s": "白厄", "t": "也许，是它在怒吼吧。向着它的造物主，它的神明。"}, {"s": "黑天鹅", "t": "那位活泼的小姑娘方才同我说了一些关于「你」的事……"}, {"s": "克拉拉", "t": "出了问题的小机器人会到处乱窜，闯进人们的帐篷里，弄坏大家的财物…很多叔叔阿姨这次都被波及到了，非常头疼。"}, {"s": "克拉拉", "t": "这个地方很危险，{F#姐姐}{M#哥哥}快回去吧。"}, {"s": "遐蝶", "t": "没错…我难以想象，身处黄金世，享受着无尽寿数的人们…如何会醉心于死亡？"}, {"s": "克拉拉", "t": "大家的愿望各不相同，有不同的色彩…如果同意了托帕姐姐的条件，大家是不是就没法实现自己的梦想了？"}, {"s": "希露瓦", "t": "机器算不算生命，或者说生命算不算一种机器，这都是因人而异的定义罢了。放生嘛…如果是为了保护某些动物不受伤害，我也能理解。"}, {"s": "藿藿", "t": "尾巴大爷，刚刚我也不知怎么回事…突然就……"}, {"s": "那刻夏", "t": "倒是你诚如我所料，面对权力的可乘之机毫不犹豫。就像……"}, {"s": "不死途", "t": "现在还剩下一个关键问题：「千禧杀手」做这一切究竟为了什么？"}, {"s": "砂金", "t": "够正直，我喜欢！你这个朋友我交定了——拿着，20000信用点！"}, {"s": "姬子", "t": "今天，将由我亲自下厨，为各位乘客烹饪一席充满创意的午餐。你们准备好了吗？"}, {"s": "遐蝶", "t": "不，它平平无奇，绝不是什么孤本。"}, {"s": "希儿", "t": "死板的家伙…但很能打。「地火」缺的就是这种人。"}, {"s": "黄泉", "t": "聆听、触碰、思考，由此你将获得感受。珍惜它，凭借感受，我们得以存在。这也是在「虚无」面前，人类唯一能给出的解答。"}, {"s": "赛飞儿", "t": "没错。然后，你们听到了脚步声——是我故意发出来的——那时，你们心里又在想什么？"}, {"s": "昔涟", "t": "甜蜜蜜节的顾客反馈都很好哦，全是夸我们的呢。"}, {"s": "知更鸟", "t": "不…其实我并不擅长玩游戏，只是最近想要稍微散散心，就过来看看。"}, {"s": "缇宝", "t": "但现在…它或许是给缇安的，最好的礼物了吧。"}, {"s": "赛飞儿", "t": "嗐，千言万语，总结成一句话——白忙活！"}, {"s": "风堇", "t": "感觉怎么样？再去和小奇美拉对话试试吧。"}, {"s": "景元", "t": "说来有些冒昧了，不过我观察了你们这位列车长许久，觉得它颇有些不凡之处。"}, {"s": "万敌", "t": "——告诉她们，以后不必再以肉身勘察敌后了。只需一条讯息，天谴的锋刃便会指向奥赫玛的敌人。"}, {"s": "卢卡", "t": "头有些晕…咱们赶快去看病吧。"}, {"s": "黄泉", "t": "你的「剧本」中有任何关于我的部分吗？我想知道，在命运所见的未来中，「我」留下了怎样的注脚？"}, {"s": "素裳", "t": "突然有一种「事情告一段落」的感觉了。"}, {"s": "姬子", "t": "这里和其他教室很相似，但似乎又有些不同……"}, {"s": "布洛妮娅", "t": "如果你们找上希儿，她的抽象画会是怎样的？不行，越说越想看了，如果不麻烦的话，一会儿请带上我。"}, {"s": "那刻夏", "t": "这就是大地兽教给我们的最朴素的道理。"}, {"s": "桂乃芬", "t": "我们老家那边就经常会讲「有时人心比魔鬼更可怕」，你看那岁阳害怕的样子，我才明白这句话应该是真的吧。"}, {"s": "艾丝妲", "t": "目前状况还在控制之中。安保系统受到的破坏很轻微，入侵者只改写了少数核心数据，因此很容易修复。"}, {"s": "希露瓦", "t": "我心说，该不会是又托了星穹列车的福吧？现在看来，果然是这样的。"}, {"s": "阿格莱雅", "t": "在我写下这些文字时，你正与元老院的辩论家唇齿交锋，在硝烟无形的战场上争取逐火之旅的存续。"}, {"s": "符玄", "t": "至于出现在我们身边的这位「停云」…正如瓦尔特先生所言，她表现出的阴毒与残忍正是为了扰乱我们的心神，切不可落入陷阱。"}, {"s": "遐蝶", "t": "那是保管{RUBY_B#理性之泰坦}瑟希斯{RUBY_E#}火种的地方，就在巨木顶部。照他的说法，火种应该还在那里。"}, {"s": "素裳", "t": "算来算去，只有我一个留下最妥当嘛。"}, {"s": "流萤", "t": "真的吗？看来…卡芙卡教给我的没错。"}, {"s": "卢卡", "t": "三位真是好身手！我也从这场战斗中学到了很多，感谢你们。"}, {"s": "赛飞儿", "t": "用料朴素，但做工一如既往地精湛。好久没见，手艺不减啊。而且…还特别用心。"}, {"s": "佩拉", "t": "我看也是，被我抓到的话一定得好好教训一顿。"}, {"s": "姬子", "t": "难怪各位一定要{M#他}{F#她}出面呢。"}, {"s": "银狼", "t": "幸好，你我都不必理解它的意思。"}, {"s": "银狼", "t": "哼，她才没空对付我这种「小人物」呢。"}, {"s": "流萤", "t": "「我梦见一片焦土，一株破土而生的新蕊，它迎着朝阳绽放，向我低语呢喃。」"}, {"s": "艾丝妲", "t": "阿兰…对不起，我都不知道自己给了你这么多压力……"}, {"s": "符玄", "t": "不过，这些日子代行将军职务，确实有不一样的体会——"}, {"s": "娜塔莎", "t": "「志愿导览员申请表」…呵呵，还真是有模有样。"}, {"s": "素裳", "t": "倒是我，得多谢你在比剑时挣扎和手下留情了……"}, {"s": "风堇", "t": "这是怎么回事…奥赫玛的大家，还有我？连我也在老师的研究范围内？"}, {"s": "黄泉", "t": "不同于此刻的集结——太一之梦的消散需要时间，足以引起{RUBY_B#太一}星期日{RUBY_E#}的注意。"}, {"s": "虎克", "t": "老爹的宝贝…不会已经被卖掉了吧？"}, {"s": "昔涟", "t": "我是…最初的智种，翁法罗斯之心，德谬歌。"}, {"s": "瓦尔特", "t": "为了对抗天外降临的外星入侵者，我和某个…老朋友一起踏上旅途，想要一劳永逸地解决这个威胁。"}, {"s": "白厄", "t": "记得雨之民提到过，它讨厌阴天。能否利用这点，改变画壁上的天气，影响「化身印记」的行为？"}, {"s": "黄泉", "t": "就像所有命途一样，无论你是否承认，「虚无」都已「存在」，而一切存在，也都无法彻底摆脱虚无。"}, {"s": "缇宝", "t": "小灰，准备好去参加美食评审了嘛？"}, {"s": "希儿", "t": "数量再多也只是杂碎而已——别退后！"}, {"s": "银狼", "t": "算上今天这一出，要再加一条：精神失常。"}, {"s": "桑博", "t": "这下层区一大半都是矿民，每天就靠挖这种矿石过活。要是没有「地髓」可烧，这个世界的人早就被冻死了。"}, {"s": "白厄", "t": "不必考量本心，不必渴求胜利。若我生来就是罪恶的容器……"}, {"s": "卢卡", "t": "噢，正是！实话告诉你们，我正着手筹备一个计划……"}, {"s": "娜塔莎", "t": "你们来这里，是打算帮忙解决矿区的矛盾吗？"}, {"s": "姬子", "t": "也许，这儿已不在现实中了。我们可能因为某些不知名的原因掉进了「画中世界」的某处。"}, {"s": "万敌", "t": "千万次…我已挣脱过死亡的枷锁。此次…也不例外。"}, {"s": "虎克", "t": "嘿嘿，我就知道！果然还是诊所更漂亮啦！"}, {"s": "克拉拉", "t": "因为他听说了有矿工和流浪者们发生了大规模的争斗…他的本意是想阻止大家为了矿脉流血。"}, {"s": "佩拉", "t": "唉…别吓我呀。告诉你吧，其实是原本陈列在这个柜子里的展品最近失窃了。"}, {"s": "万敌", "t": "…失礼了，我不该这么粗鲁。那个男人能挺过去，我心里清楚。"}, {"s": "艾丝妲", "t": "「——美丽娇艳的花儿也经不起烈日的灼晒，卡波特将永远在你身后给予你柔情与关怀。」"}, {"s": "丹恒", "t": "这是…水盆？看着像是某种仪式用具。"}, {"s": "希儿", "t": "这个数量…确定裂界怪物是最近才涌进来的吗？"}, {"s": "希露瓦", "t": "瓦尔特先生找我打听了半天……"}, {"s": "知更鸟", "t": "我本以为「英灵」的模样会…显得更特别？"}, {"s": "知更鸟", "t": "斯科特？是那位擅长仿生口技表演的公司专员吗？"}, {"s": "阿格莱雅", "t": "陷阱？当然不是。请把它当作一种交流的仪式。"}, {"s": "知更鸟", "t": "舒翁女士，在你看来，{RUBY_B#生命因何而沉睡}鸟为什么要飞上天空{RUBY_E#}？"}, {"s": "桑博", "t": "要绕到对面，恐怕得跑好长一段路——各位，咱们坐弹球机蹦到对岸去吧！"}, {"s": "卢卡", "t": "我不是为了争夺什么荣誉才参加搏击比赛的…嗐，听着是不是有点故作谦虚的意思？但我真的是这么想的，你得信我！"}, {"s": "赛飞儿", "t": "让我来好好闻一闻，这空气里的味道……"}, {"s": "克拉拉", "t": "{F#大姐姐}{M#大哥哥}？！你怎么......"}, {"s": "彦卿", "t": "将军教我学习剑术，每到关键的节点，他便会亲自下场与我对练，测试我水平如何。"}, {"s": "缇宝", "t": "那我先去处理别的事啦。回头见哦，祝你们玩得开心。"}, {"s": "希露瓦", "t": "…哈？不至于不至于，老爸他确实总是凶巴巴的，但和裂界里的怪物还是比不了吧？"}, {"s": "三月七", "t": "嘘！小声，别让帕姆发现了…我们正给它挑慰劳礼物呢。"}, {"s": "卢卡", "t": "有机会的话，一定！前提是你们得好好学习，好好吃饭！"}, {"s": "青雀", "t": "不过杨先生要是感兴趣，星槎海有家买卖玉兆首饰的店铺，得空了我可以带您逛逛。"}, {"s": "黑塔", "t": "这里视野不错。交给你了，螺丝。"}, {"s": "藿藿", "t": "总之，我一定尽力而为，不给大家拖后腿！"}, {"s": "银狼", "t": "但这个登场方式还是很酷的，对吧？"}, {"s": "白厄", "t": "…万敌，你会觉得可惜吗？自己没有活在那个强者如云的年代。若非往日的英雄一一凋零，我也不会是你唯一的对手。"}, {"s": "卢卡", "t": "我好多了…很抱歉刚才说了些不得体的话。但我确实觉得几位云骑朋友的水平非同一般。"}, {"s": "符玄", "t": "为何尽是些「欢愉」垂迹之地？"}, {"s": "三月七", "t": "原来如此，相比冀望缥缈的未来，佩拉更希望身边的人能过上好的生活……"}, {"s": "瓦尔特", "t": "我们是将军请来的援助。请问其他人都到哪儿去了？"}, {"s": "彦卿", "t": "将军此时正承担着莫大的压力。可我竟全然不察将军的苦恼…真是幼稚！"}, {"s": "三月七", "t": "这不是青雀吗？我好像第一次见到青雀在认真工作！"}, {"s": "银狼", "t": "当然，我也可以选择加入公司，或者巡海游侠，甚至利用一下泯灭帮，只要能让我奔向银河，走哪条路都可以。"}, {"s": "知更鸟", "t": "在美梦中焚烧出的新居吗？如果你们想要好好谈谈，不该用这种方式进行挑衅。"}, {"s": "虎克", "t": "啊？你的意思是…我们搞错了？"}, {"s": "布洛妮娅", "t": "正是凭借那笔资金，贝洛伯格才得以建起如此高大的城墙…甚至连最初一批自动机兵的研发经费都是从那笔钱里划出来的。"}, {"s": "缇宝", "t": "这段漫长的旅程，*我们*一直都陪在阿雅身边，比谁都清楚她心中所想。"}, {"s": "缇宝", "t": "你觉得…自己有机会战胜它吗？令你害怕的那样东西？"}, {"s": "桑博", "t": "输了…无敌的策略机铠丁八百也输了……"}, {"s": "三月七", "t": "我有做什么惊天动地的大事吗？最近除了逼着帕姆换了几套衣服，偷偷借用了几次杨叔的肩颈按摩仪……"}, {"s": "万敌", "t": "无妨…无愧本心地选择吧。就算要再等上千年……"}, {"s": "阿格莱雅", "t": "「逐火是不断失却的旅途。但你会失去的，远比生命更为沉重。」"}, {"s": "风堇", "t": "祖母，您还记得我那时的选择吗？"}, {"s": "赛飞儿", "t": "哎唷！你怎、你是怎么跑到我前面去的？！"}, {"s": "娜塔莎", "t": "我了解哥哥，他对医学实验的态度严谨得可怕。不管条件有多艰辛，他也绝对不会漏记任何一次实验结果。"}, {"s": "姬子", "t": "你从来都不是观众心目中唯一的可选项啊，火花。"}, {"s": "知更鸟", "t": "之前在晖长石号上，我本来打算花些时间和星穹列车的各位好好聊聊，没想到却被那出炸弹闹剧给搅乱了。"}, {"s": "藿藿", "t": "恚炎的力量这么强大，为何却如此轻易地愿意将自己分裂开来？"}, {"s": "那刻夏", "t": "可惜，就算他们的旅途与我们庶几相似，还有你与卡吕普索，尼卡多利与格奈乌斯从旁佐证，也只能为「轮回」的猜想勾勒蓝图。"}, {"s": "阿格莱雅", "t": "你很敏锐，丹恒阁下。两位先前的作为已证明了自己的善意——我们愿以这樽神血蜜露为证，与开拓者们浅结盟谊。"}, {"s": "黄泉", "t": "这样啊…你也有类似的经历吗？那你应当知道，我和你记忆中的她并非同一人。"}, {"s": "虎克", "t": "网上说「演武仪典都快成兵器展了，再这样下去歼星炮都要用上了」。"}, {"s": "缇宝", "t": "虽说*我们*有三个人，但搬桌子这种工作还是太困难啦。小灰问问其余伙伴吧？"}, {"s": "艾丝妲", "t": "佩佩想玩赛车很久了，至于我…过来给黑塔空间站打打广告，算是工作休闲两不耽误。"}, {"s": "希露瓦", "t": "…这家伙，好吵啊！裂界造物居然还会碎碎念吗？"}, {"s": "艾丝妲", "t": "所以，你以为是理查偷走了我的密钥？"}, {"s": "阿格莱雅", "t": "我心中有数：当她念出自己追寻已久的答案后，其命运便能迎来圆满。"}, {"s": "桂乃芬", "t": "藿藿不见了，你这坏东西一定知道点什么，对吧！"}, {"s": "布洛妮娅", "t": "该到做决定的时候了。这种…这么混乱的局面，不能再持续下去了。"}, {"s": "姬子", "t": "嗯。十五年前，我加入游戏时也是这么想的。这场游戏允许谒者做任何事，不论善恶，这也就意味着游戏推进过程中的一切都处于失控。"}, {"s": "素裳", "t": "我没骗你们吧？说把你们带到安全的地方，就言出必践！虽然…绕了点远路……"}, {"s": "丹恒", "t": "…这是计划好的背叛，毫无疑问。"}, {"s": "娜塔莎", "t": "离得这么近观察你战斗的样子，我还是头一次。帅气又利落，不愧是下层区的救星。"}, {"s": "遐蝶", "t": "这几日相处下来，我好像也渐渐能听懂它话中的含义了…虽然只是一小部分。"}, {"s": "布洛妮娅", "t": "…母亲是为了「存护」贝洛伯格而牺牲的。"}, {"s": "希儿", "t": "…我可没娜塔这么好说话，这事不能就这么过去了。趁这功夫，你赶紧解释一下，之前到底是哪根筋搭错了？"}, {"s": "万敌", "t": "够了，别扯这些没用的。身为「纷争」之神，何不以剑明志，让我们速战速决！"}, {"s": "砂金", "t": "我需要你的帮助，所以会等你——但也不会等太久。准备好了…就跟上来吧。"}, {"s": "不死途", "t": "真正的狸猫应该懂得，有些话永远不要讲出口。"}, {"s": "景元", "t": "哈哈，在我眼前的可是人称「未卜先知，法眼无遗」的符卿啊，趋吉避凶不是你的看家本领么？"}, {"s": "风堇", "t": "可架不住总有人     ${bar('感叹',p.exclaim,MAXV.exclaim,'#e8533e','%')}
    ${bar('疑问',p.question,MAXV.question,'#c07de0','%')}
    ${bar('笑声',p.laugh,MAXV.laugh,'#e3b341','%')}
    <div class="chips">${p.distinct.map(([w,c])=>`<span class="chip" title="出现 ${c} 次">${w}</span>`).join('')}</div>
    ${Object.keys(p.address).length?`<div class="chips">${Object.entries(p.address).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([k,v])=>`<span class="chip gold">称呼「${k==='{NICKNAME}'?'你的名字':k}」×${v}</span>`).join('')}</div>`:''}
    <div class="quote">最短：「${p.shortest}」<br>最长：「${p.longest}${p.longest.length>=120?'…':''}」</div>
  </div>`).join('');
}
renderFP();

// ── 相似度 ──
(function(){
  const N=D.simNames, S=D.sim;
  let html='<table><tr><th></th>'+N.map(n=>`<th class="v">${n}</th>`).join('')+'</tr>';
  const vals=[];S.forEach((r,i)=>r.forEach((v,j)=>{if(i!==j)vals.push(v)}));
  const lo=Math.min(...vals),hi=Math.max(...vals);
  S.forEach((row,i)=>{html+=`<tr><th style="text-align:right">${N[i]}</th>`+row.map((v,j)=>{const t=i===j?1:(v-lo)/(hi-lo);const c=`rgba(88,166,255,${(0.08+t*0.92).toFixed(2)})`;return `<td style="background:${c}" title="${N[i]} × ${N[j]} = ${v}"></td>`}).join('')+'</tr>'});
  document.getElementById('heat').innerHTML=html+'</table>';
  const pairs=[];for(let i=0;i<N.length;i++)for(let j=i+1;j<N.length;j++)pairs.push([N[i],N[j],S[i][j]]);
  pairs.sort((a,b)=>b[2]-a[2]);
  const f=p=>`<div class="pair"><span>${p[0]} × ${p[1]}</span><b>${p[2].toFixed(3)}</b></div>`;
  document.getElementById('pairsHi').innerHTML=pairs.slice(0,12).map(f).join('');
  document.getElementById('pairsLo').innerHTML=pairs.slice(-12).reverse().map(f).join('');
})();

// ── 竞猜 ──
const NAMES=[...new Set(D.quiz.map(q=>q.s))];
let qi=0,qScore=0,qTotal=0,answered=false;
function nextQ(){
  answered=false;const q=D.quiz[qi++%D.quiz.length];
  const opts=new Set([q.s]);while(opts.size<4)opts.add(NAMES[Math.floor(Math.random()*NAMES.length)]);
  const arr=[...opts].sort(()=>Math.random()-.5);
  document.getElementById('qText').textContent='「'+q.t+'」';
  document.getElementById('qOpts').innerHTML=arr.map(n=>`<button class="opt" onclick="answer(this,'${n}','${q.s}')">${n}</button>`).join('');
  document.getElementById('qScore').textContent=qTotal?`已答 ${qTotal} 题，正确 ${qScore}（${Math.round(qScore/qTotal*100)}%）`:'';
}
function answer(btn,n,s){if(answered)return;answered=true;qTotal++;if(n===s){qScore++;btn.classList.add('ok')}else{btn.classList.add('bad');[...document.querySelectorAll('.opt')].find(b=>b.textContent===s).classList.add('ok')}document.getElementById('qScore').textContent=`已答 ${qTotal} 题，正确 ${qScore}（${Math.round(qScore/qTotal*100)}%）`;}
nextQ();

// ── 开拓者 ──
const TB=D.tb;
document.getElementById('tbStats').innerHTML=[
 [TB.total.toLocaleString(),'可选台词总数'],[TB.avgLen+' 字','平均长度'],[TB.paren.toLocaleString(),'括号内心独白'],[TB.ellipsis.toLocaleString(),'带省略号'],[TB.question.toLocaleString(),'反问/疑问'],[TB.exclaim.toLocaleString(),'感叹句'],[TB.trash,'提到垃圾桶']
].map(([v,l])=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`).join('');
function tbRandom(){document.getElementById('tbLine').textContent='「'+TB.sample[Math.floor(Math.random()*TB.sample.length)]+'」';}
tbRandom();
document.getElementById('tbTrash').innerHTML=TB.trashLines.map(l=>`<div>· ${l}</div>`).join('')||'<div>（无）</div>';
</script>
